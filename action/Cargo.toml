[package]
name = "oskey-action"
version = "0.0.1"
edition = "2021"
description = ""
license = ""

[features]
default = ["crypto-rs"]
crypto-rs = ["oskey-chain/crypto-rs", "oskey-wallet/crypto-rs"]
crypto-psa = ["oskey-chain/crypto-psa", "oskey-wallet/crypto-psa"]
crypto-link = ["oskey-chain/crypto-link", "oskey-wallet/crypto-psa", "oskey-wallet/build"]

[dependencies]
oskey-bus.workspace = true
oskey-chain.workspace = true
oskey-wallet.workspace = true

anyhow.workspace = true
zeroize.workspace = true

[dev-dependencies]
p256.workspace = true
